name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore root files if missing
        run: cp -n tools/rootfiles/* .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Cache engine and voice pack
        uses: actions/cache@v4
        with:
          path: ~/.cache/talking-cat-engine
          key: cat-engine-${{ hashFiles('fetch-engine.sh', 'tools/lessons.json', 'tools/pregen.py') }}
      - name: Build debug APK
        env:
          PREGEN_MINUTES: '120'
          PREGEN_STEPS: '8'
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: talking-cat-apk
          path: app/build/outputs/apk/debug/app-debug.apk
